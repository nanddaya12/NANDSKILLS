services:

  # ── NANDSKILLS Laravel Application ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nandskills_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "NANDSKILLS"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-https://app.nandskills.com}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-nandskills_db}"
      DB_USERNAME: "${DB_USERNAME:-nandskills}"
      DB_PASSWORD: "${DB_PASSWORD}"
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      MAIL_MAILER: smtp
      MAIL_HOST: "${MAIL_HOST:-smtp.mailtrap.io}"
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-minio}"
      AWS_ENDPOINT: "http://minio:9000"
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-nandskills_admin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-nandskills_secret}"
      AWS_BUCKET: "${AWS_BUCKET:-nandskills-uploads}"
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    volumes:
      - app_logs:/var/www/html/storage/logs
      - app_cache:/var/www/html/bootstrap/cache
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - nandskills_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: nandskills_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootpassword}"
      MYSQL_DATABASE: "${DB_DATABASE:-nandskills_db}"
      MYSQL_USER: "${DB_USERNAME:-nandskills}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-nandskillspassword}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - nandskills_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-nandskills}", "-p${DB_PASSWORD:-nandskillspassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+00:00
      --innodb-buffer-pool-size=512M
      --max-connections=200

  # ── Redis Cache & Sessions ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nandskills_redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - nandskills_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO Object Storage (S3-compatible) ────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: nandskills_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-nandskills_admin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-nandskills_secret}"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - nandskills_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── phpMyAdmin (dev-only, remove in strict production) ─────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: nandskills_phpmyadmin
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: "${DB_USERNAME:-nandskills}"
      PMA_PASSWORD: "${DB_PASSWORD:-nandskillspassword}"
    ports:
      - "8080:80"
    networks:
      - nandskills_network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  app_logs:
    driver: local
  app_cache:
    driver: local

networks:
  nandskills_network:
    driver: bridge
